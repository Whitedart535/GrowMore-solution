<svg xmlns="http://www.w3.org/2000/svg" viewBox="30 15 440 320" width="100%" height="100%" xml:space="preserve" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <!-- Rich Gradients for Ultra-HD Clarity -->
    <linearGradient id="greenBarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1B7A0D" />
      <stop offset="60%" stop-color="#2DA817" />
      <stop offset="100%" stop-color="#44C220" />
    </linearGradient>

    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#289A12" />
      <stop offset="100%" stop-color="#5AD62A" />
    </linearGradient>

    <linearGradient id="blueSwooshGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#003B7A" />
      <stop offset="40%" stop-color="#0057A8" />
      <stop offset="85%" stop-color="#0080E5" />
      <stop offset="100%" stop-color="#0099FF" />
    </linearGradient>

    <linearGradient id="darkSwooshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#002247" />
      <stop offset="100%" stop-color="#004080" />
    </linearGradient>

    <linearGradient id="growTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34A818" />
      <stop offset="100%" stop-color="#1B7A0D" />
    </linearGradient>

    <linearGradient id="moreTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0057A8" />
      <stop offset="100%" stop-color="#002B5B" />
    </linearGradient>

    <!-- Sharp Drop Shadow -->
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.10" />
    </filter>
  </defs>

  <g filter="url(#crispShadow)">
    <!-- EMBLEM GRAPHIC -->
    <g transform="translate(0, 0)">
      <!-- 3 Green Bars -->
      <rect x="154" y="118" width="18" height="52" rx="4" fill="url(#greenBarGrad)" />
      <rect x="178" y="98" width="18" height="72" rx="4" fill="url(#greenBarGrad)" />
      <rect x="202" y="80" width="18" height="90" rx="4" fill="url(#greenBarGrad)" />

      <!-- Triple Sprouting Leaves -->
      <!-- Left Leaf -->
      <path d="M 200 92 C 172 72 178 42 202 34 C 206 58 222 68 200 92 Z" fill="url(#leafGrad)" />
      <!-- Center Leaf -->
      <path d="M 232 80 C 232 38 258 20 258 50 C 258 72 242 84 232 80 Z" fill="url(#leafGrad)" />
      <!-- Right Leaf -->
      <path d="M 252 88 C 274 65 306 78 296 102 C 272 105 260 94 252 88 Z" fill="url(#leafGrad)" />
      <!-- Leaf Central Stem -->
      <path d="M 231 112 Q 233 80 246 60" fill="none" stroke="#1B7A0D" stroke-width="3" stroke-linecap="round" />

      <!-- Blue Swooping Arrow -->
      <!-- Dark Blue Shadow Arch underneath -->
      <path d="M 130 162 C 145 220 230 245 375 190 C 290 226 195 212 142 172 Z" fill="url(#darkSwooshGrad)" opacity="0.8" />

      <!-- Main Blue Swoosh & Arrow Head -->
      <path d="M 125 158 C 132 215 220 240 372 185 L 354 162 L 418 152 L 398 214 L 382 190 C 242 242 140 216 125 158 Z" fill="url(#blueSwooshGrad)" />
    </g>

    <!-- TYPOGRAPHY SECTION -->
    <!-- "Grow More" -->
    <g transform="translate(250, 282)" text-anchor="middle">
      <text x="-95" y="0" font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="62" fill="url(#growTextGrad)" letter-spacing="-1.5">Grow</text>
      <text x="85" y="0" font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="62" fill="url(#moreTextGrad)" letter-spacing="-1.5">More</text>
    </g>

    <!-- "SOLUTIONS" -->
    <g transform="translate(250, 326)" text-anchor="middle">
      <line x1="-215" y1="-7" x2="-95" y2="-7" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
      <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Montserrat', 'Inter', system-ui, -apple-system, sans-serif" font-weight="800" font-size="24" fill="#334155" letter-spacing="10">SOLUTIONS</text>
      <line x1="95" y1="-7" x2="215" y2="-7" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
